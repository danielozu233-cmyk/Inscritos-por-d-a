        function normalizeFaculty(rawName) {
            if (!rawName) return "Aplicadas";
            const clean = String(rawName).trim().toLowerCase();
            if (FACULTY_MAPPING[clean]) return FACULTY_MAPPING[clean];
            for (const key in FACULTY_MAPPING) {
                if (clean.includes(key)) return FACULTY_MAPPING[key];
            }
            return "Aplicadas";
        }

        let currentUser = null;
        let allEnrollmentsCache = [];
        let globalHistoricalCounts = {};
        let currentSelectedMonth = ""; 
        let facultyFilter = "ALL";

        window.addEventListener("DOMContentLoaded", () => {
            const loginModal = document.getElementById("login-modal");
            const appContainer = document.getElementById("app-container");
            const loginForm = document.getElementById("login-form");
            const loginError = document.getElementById("login-error");
            const logoutBtn = document.getElementById("logout-btn");
            const userEmailSpan = document.getElementById("user-email");
            const monthSelect = document.getElementById("month-select");
            const facultySelect = document.getElementById("faculty-select");

                } catch (err) {
                    loginError.textContent = "Error al iniciar sesión: " + (err.message || "Credenciales inválidas");

            logoutBtn.addEventListener("click", async () => {

            monthSelect.addEventListener("change", (e) => {
                currentSelectedMonth = e.target.value;

            facultySelect.addEventListener("change", (e) => {

            excelFileInput.addEventListener("change", handleFileUpload);
            exportBtn.addEventListener("click", exportToExcel);

            closeBlendedBtn.addEventListener("click", () => {

            blendedModal.addEventListener("click", (e) => {

        async function loadDataAndInitialize() {
            showLoading("Cargando datos desde Firestore...");
            try {
                const q = collection(db, "enrollments");
                const snapshot = await getDocs(q);
                allEnrollmentsCache = [];
                snapshot.forEach(docSnap => {
                    allEnrollmentsCache.push(docSnap.data());
                });

                calculateGlobalHistorical();
                populateMonthSelector();
                renderDashboard();
                hideLoading();
            } catch (err) {
                console.error(err);
                hideLoading();
                showToast("Error al cargar registros: " + err.message, "error");
            }
        }

        function calculateGlobalHistorical() {
            globalHistoricalCounts = {};
            Object.keys(FIXED_GOALS).forEach(fac => {
                globalHistoricalCounts[fac] = 0;
            });
            allEnrollmentsCache.forEach(item => {
                const fac = normalizeFaculty(item.DescFacultad);
                if (globalHistoricalCounts[fac] !== undefined) {
                    globalHistoricalCounts[fac]++;
                }
            });
        }

        function populateMonthSelector() {
            const monthSelect = document.getElementById("month-select");
            monthSelect.innerHTML = "";
            const monthsSet = new Set();

            allEnrollmentsCache.forEach(item => {
                const dStr = parseDateString(item.Fecha_Inscripcion);
                if (dStr) {
                    const ym = dStr.substring(0, 7); 
                    monthsSet.add(ym);
                }
            });

            const sortedMonths = Array.from(monthsSet).sort();
            if (sortedMonths.length === 0) {
                const now = new Date();
                const currentYM = now.toISOString().substring(0, 7);
                sortedMonths.push(currentYM);
            }

            sortedMonths.forEach(ym => {
                const opt = document.createElement("option");
                opt.value = ym;
                opt.textContent = formatMonthName(ym);
                monthSelect.appendChild(opt);
            });

            if (!sortedMonths.includes(currentSelectedMonth)) {
                currentSelectedMonth = sortedMonths[sortedMonths.length - 1];
            }
            monthSelect.value = currentSelectedMonth;
        }

        function parseDateString(val) {
            if (!val) return null;
            if (typeof val === "number") {
                const utcDays = Math.floor(val - 25569);
                const dateObj = new Date(utcDays * 86400 * 1000);
                return dateObj.toISOString().substring(0, 10);
            }
            const str = String(val).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
            if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str)) {
                const parts = str.split("/");
                return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
            const dt = new Date(str);
            if (!isNaN(dt.getTime())) {
                return dt.toISOString().substring(0, 10);
            }
            return null;
        }

        function formatMonthName(ym) {
            const [year, month] = ym.split("-");
            const date = new Date(year, parseInt(month) - 1, 1);
            return date.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }).toUpperCase();
        }

        function renderDashboard() {
            const container = document.getElementById("dashboard-weeks-container");
            container.innerHTML = "";

            if (!currentSelectedMonth) {
                container.innerHTML = `<div class="p-8 text-center text-gray-500">No hay datos disponibles. Importa un archivo Excel para comenzar.</div>`;
                return;
            }

            const [yearStr, monthStr] = currentSelectedMonth.split("-");
            const year = parseInt(yearStr);
            const month = parseInt(monthStr) - 1;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysMap = {};
            for (let d = 1; d <= daysInMonth; d++) {
                const dayStr = String(d).padStart(2, '0');
                const dateKey = `${currentSelectedMonth}-${dayStr}`;
                daysMap[dateKey] = {};
                Object.keys(FIXED_GOALS).forEach(fac => {
                    daysMap[dateKey][fac] = 0;
                });
            }

            allEnrollmentsCache.forEach(item => {
                const dKey = parseDateString(item.Fecha_Inscripcion);
                if (dKey && dKey.startsWith(currentSelectedMonth)) {
                    const fac = normalizeFaculty(item.DescFacultad);
                    if (daysMap[dKey] && daysMap[dKey][fac] !== undefined) {
                        daysMap[dKey][fac]++;
                    }
                }
            });

            const weeks = [];
            let currentWeek = [];

            for (let d = 1; d <= daysInMonth; d++) {
                const dayStr = String(d).padStart(2, '0');
                const dateKey = `${currentSelectedMonth}-${dayStr}`;
                const dateObj = new Date(year, month, d);
                let jsDay = dateObj.getDay(); 
                let isoDay = jsDay === 0 ? 7 : jsDay; 

                currentWeek.push({ dateKey, dateObj, isoDay });

                if (isoDay === 7 || d === daysInMonth) {
                    weeks.push(currentWeek);
                    currentWeek = [];
                }
            }

            const faculties = Object.keys(FIXED_GOALS);
            const filteredFaculties = facultyFilter === "ALL" ? faculties : [facultyFilter];

            const targetEndDate = `${currentSelectedMonth}-${String(daysInMonth).padStart(2, '0')}`;
            let totalMonthEnrollments = 0;
            Object.keys(daysMap).forEach(dKey => {
                filteredFaculties.forEach(fac => {
                    totalMonthEnrollments += daysMap[dKey][fac];
                });
            });

            let totalGoalFiltered = filteredFaculties.reduce((acc, f) => acc + FIXED_GOALS[f], 0);
            let totalCumulativeFiltered = filteredFaculties.reduce((acc, f) => acc + (globalHistoricalCounts[f] || 0), 0);
            let globalPct = totalGoalFiltered > 0 ? ((totalCumulativeFiltered / totalGoalFiltered) * 100).toFixed(1) : "0.0";

            document.getElementById("kpi-month-total").textContent = totalMonthEnrollments.toLocaleString();
            document.getElementById("kpi-total-cumulative").textContent = `${totalCumulativeFiltered.toLocaleString()} / ${totalGoalFiltered.toLocaleString()}`;
            document.getElementById("kpi-global-progress").textContent = `${globalPct}%`;

            weeks.forEach((weekDays, wIndex) => {
                const weekWrapper = document.createElement("div");
                weekWrapper.className = "mb-10 bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden";
                
                const weekHeader = document.createElement("div");
                weekHeader.className = "bg-slate-800 text-white px-6 py-3 font-bold text-sm tracking-wide flex justify-between items-center";
                weekHeader.innerHTML = `<span>SEMANA ${wIndex + 1} (${formatWeekRange(weekDays)})</span><span>Total Facultades: ${filteredFaculties.length}</span>`;
                weekWrapper.appendChild(weekHeader);

                const scrollContainer = document.createElement("div");
                scrollContainer.className = "overflow-x-auto p-4";

                const tablesFlex = document.createElement("div");
                tablesFlex.className = "inline-flex gap-4 items-start pb-2";

                weekDays.forEach(dayInfo => {
                    const dayTableBox = document.createElement("div");
                    dayTableBox.className = "w-80 flex-shrink-0 bg-white rounded-lg border border-slate-300 shadow-sm overflow-hidden flex flex-col";

                    const dayNamesMap = ["LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO", "DOMINGO"];
                    const dayNameIndex = dayInfo.isoDay - 1;
                    const dateFormatted = dayInfo.dateObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).toUpperCase();

                    const tableHeader = document.createElement("div");
                    tableHeader.className = "bg-slate-700 text-white text-center py-2 px-1 font-bold text-xs uppercase tracking-wider";
                    tableHeader.textContent = `${dayNamesMap[dayNameIndex]} ${dateFormatted}`;
                    dayTableBox.appendChild(tableHeader);

                    const table = document.createElement("table");
                    table.className = "w-full text-left border-collapse text-xs";
                    
                    const thead = document.createElement("thead");
                    thead.innerHTML = `
                        <tr class="bg-slate-100 text-slate-700 border-b border-slate-300">
                            <th class="py-2 px-2 font-semibold">Facultad</th>
                            <th class="py-2 px-1 font-semibold text-right">Meta</th>
                            <th class="py-2 px-1 font-semibold text-right">Est.</th>
                            <th class="py-2 px-1 font-semibold text-right">Pend.</th>
                            <th class="py-2 px-1 font-semibold text-right">% Día</th>
                            <th class="py-2 px-1 font-semibold text-right">Ins.</th>
                        </tr>
                    `;
                    table.appendChild(thead);

                    const tbody = document.createElement("tbody");
                    let dayTotalEst = 0;
                    let dayTotalMeta = 0;
                    let dayTotalPend = 0;
                    let dayTotalInsDay = 0;

                    filteredFaculties.forEach(fac => {
                        const goal = FIXED_GOALS[fac];
                        const estDayOnly = daysMap[dayInfo.dateKey][fac]; // Inscriptos del día
                        
                        // Acumulado global hasta este día (Est.)
                        let historicalUntilThisDay = 0;
                        allEnrollmentsCache.forEach(item => {
                            const dK = parseDateString(item.Fecha_Inscripcion);
                            if (dK && dK <= dayInfo.dateKey) {
                                if (normalizeFaculty(item.DescFacultad) === fac) {
                                    historicalUntilThisDay++;
                                }
                            }
                        });

                        const pend = Math.max(0, goal - historicalUntilThisDay);
                        const pctDay = goal > 0 ? ((estDayOnly / goal) * 100).toFixed(1) : "0.0";

                        dayTotalMeta += goal;
                        dayTotalEst += historicalUntilThisDay;
                        dayTotalPend += pend;
                        dayTotalInsDay += estDayOnly;

                        const tr = document.createElement("tr");
                        tr.className = "border-b border-slate-200 hover:bg-amber-100 transition-colors duration-150";
                        tr.innerHTML = `
                            <td class="py-1.5 px-2 font-medium text-slate-800 truncate max-w-[100px]" title="${fac}">${fac}</td>
                            <td class="py-1.5 px-1 text-right text-slate-600">${goal.toLocaleString()}</td>
                            <td class="py-1.5 px-1 text-right font-bold text-slate-900">${historicalUntilThisDay.toLocaleString()}</td>
                            <td class="py-1.5 px-1 text-right text-slate-600">${pend.toLocaleString()}</td>
                            <td class="py-1.5 px-1 text-right text-slate-500">${pctDay}%</td>
                            <td class="py-1.5 px-1 text-right font-semibold text-blue-600">${estDayOnly}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    table.appendChild(tbody);

                    const tfoot = document.createElement("tfoot");
                    let dayTotalPct = dayTotalMeta > 0 ? ((dayTotalInsDay / dayTotalMeta) * 100).toFixed(1) : "0.0";
                    tfoot.innerHTML = `
                        <tr class="bg-slate-800 text-white font-bold border-t-2 border-slate-900">
                            <td class="py-2 px-2">TOTAL</td>
                            <td class="py-2 px-1 text-right">${dayTotalMeta.toLocaleString()}</td>
                            <td class="py-2 px-1 text-right">${dayTotalEst.toLocaleString()}</td>
                            <td class="py-2 px-1 text-right">${dayTotalPend.toLocaleString()}</td>
                            <td class="py-2 px-1 text-right">${dayTotalPct}%</td>
                            <td class="py-2 px-1 text-right">${dayTotalInsDay}</td>
                        </tr>
                    `;
                    table.appendChild(tfoot);

                    dayTableBox.appendChild(table);
                    tablesFlex.appendChild(dayTableBox);
                });

                const weekTotalBox = document.createElement("div");
                weekTotalBox.className = "w-60 flex-shrink-0 bg-teal-900 text-white rounded-lg border border-teal-950 shadow-md overflow-hidden flex flex-col";

                const weekTableHeader = document.createElement("div");
                weekTableHeader.className = "bg-teal-950 text-white text-center py-2 px-1 font-bold text-xs uppercase tracking-wider";
                weekTableHeader.textContent = `TOTAL SEMANA`;
                weekTotalBox.appendChild(weekTableHeader);

                const weekTable = document.createElement("table");
                weekTable.className = "w-full text-left border-collapse text-xs";
                
                const weekThead = document.createElement("thead");
                weekThead.innerHTML = `
                    <tr class="bg-teal-900 text-teal-100 border-b border-teal-800">
                        <th class="py-2 px-2 font-semibold">Facultad</th>
                        <th class="py-2 px-2 font-semibold text-right">Inscritos</th>
                    </tr>
                `;
                weekTable.appendChild(weekThead);

                const weekTbody = document.createElement("tbody");
                let weekAggregateTotal = 0;

                filteredFaculties.forEach(fac => {
                    let facWeekSum = 0;
                    weekDays.forEach(dayInfo => {
                        facWeekSum += daysMap[dayInfo.dateKey][fac];
                    });
                    weekAggregateTotal += facWeekSum;

                    const tr = document.createElement("tr");
                    tr.className = "border-b border-teal-800 hover:bg-teal-800 transition-colors duration-150";
                    tr.innerHTML = `
                        <td class="py-1.5 px-2 font-medium text-teal-100 truncate max-w-[120px]" title="${fac}">${fac}</td>
                        <td class="py-1.5 px-2 text-right font-bold text-white">${facWeekSum}</td>
                    `;
                    weekTbody.appendChild(tr);
                });
                weekTable.appendChild(weekTbody);

                const weekTfoot = document.createElement("tfoot");
                weekTfoot.innerHTML = `
                    <tr class="bg-teal-950 text-white font-bold border-t-2 border-teal-900">
                        <td class="py-2 px-2">TOTAL</td>
                        <td class="py-2 px-2 text-right">${weekAggregateTotal}</td>
                    </tr>
                `;
                weekTfoot.appendChild(weekTfoot); // Corregido
                weekTotalBox.appendChild(weekTable);

                tablesFlex.appendChild(weekTotalBox);

                scrollContainer.appendChild(tablesFlex);
                weekWrapper.appendChild(scrollContainer);
                container.appendChild(weekWrapper);
            });
        }

        function renderBlendedTable() {
            const tbody = document.getElementById("blended-tbody");
            tbody.innerHTML = "";

            let totalMeta = 0;
            let totalInscritos = 0;
            let totalPend = 0;

            Object.keys(FIXED_GOALS).forEach(fac => {
                const meta = FIXED_GOALS[fac];
                const inscritos = globalHistoricalCounts[fac] || 0;
                const pend = Math.max(0, meta - inscritos);
                const pct = meta > 0 ? ((inscritos / meta) * 100).toFixed(1) : "0.0";

                totalMeta += meta;
                totalInscritos += inscritos;
                totalPend += pend;

                const tr = document.createElement("tr");
                tr.className = "border-b border-slate-200 hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="py-2.5 px-4 font-semibold text-slate-800">${fac}</td>
                    <td class="py-2.5 px-4 text-right text-slate-600">${meta.toLocaleString()}</td>
                    <td class="py-2.5 px-4 text-right font-bold text-slate-900">${inscritos.toLocaleString()}</td>
                    <td class="py-2.5 px-4 text-right text-slate-600">${pend.toLocaleString()}</td>
                    <td class="py-2.5 px-4 text-right font-semibold text-emerald-600">${pct}%</td>
                `;
                tbody.appendChild(tr);
            });

            const totalPct = totalMeta > 0 ? ((totalInscritos / totalMeta) * 100).toFixed(1) : "0.0";
            document.getElementById("blended-tfoot").innerHTML = `
                <tr class="bg-slate-800 text-white font-bold">
                    <td class="py-3 px-4">TOTAL GENERAL</td>
                    <td class="py-3 px-4 text-right">${totalMeta.toLocaleString()}</td>
                    <td class="py-3 px-4 text-right">${totalInscritos.toLocaleString()}</td>
                    <td class="py-3 px-4 text-right">${totalPend.toLocaleString()}</td>
                    <td class="py-3 px-4 text-right">${totalPct}%</td>
                </tr>
            `;
        }

        function formatWeekRange(weekDays) {
            const first = weekDays[0].dateObj;
            const last = weekDays[weekDays.length - 1].dateObj;
            const opts = { day: 'numeric', month: 'short' };
            return `${first.toLocaleDateString('es-ES', opts)} al ${last.toLocaleDateString('es-ES', opts)}`.toUpperCase();
        }

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            showLoading("Procesando archivo Excel...");
            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (jsonRows.length === 0) {
                        hideLoading();
                        showToast("El archivo Excel está vacío.", "error");
                        return;
                    }

                    const requiredCols = [
                        "Periodo", "Codigo", "Nombre", "Apellido", "FechaNacimiento", "Edad", "Genero", 
                        "DescFacultad", "Region", "DescCampus", "Descripcion_Carrera", "TipoEst_", 
                        "Fecha_Inscripcion", "Fecha_asignacion", "Cohorte", "CorreoInstitucional", 
                        "CorreoPersonal", "Celular", "EstatusCursos", "Periodicdad"
                    ];

                    const firstRowKeys = Object.keys(jsonRows[0]);
                    const missingCols = requiredCols.filter(col => !firstRowKeys.includes(col));

                    if (missingCols.length > 0) {
                        hideLoading();
                        showToast(`Faltan columnas obligatorias: ${missingCols.slice(0, 3).join(", ")}...`, "error");
                        return;
                    }

                    showLoading("Guardando registros en Firebase (evitando duplicados)...");
                    const batchSize = 400;
                    let batch = writeBatch(db);
                    let batchCount = 0;
                    let processedCount = 0;

                    for (const row of jsonRows) {
                        const code = String(row.Codigo || "").trim();
                        const period = String(row.Periodo || "").trim();
                        const dateInsc = parseDateString(row.Fecha_Inscripcion);
                        
                        if (!code || !dateInsc) continue;

                        const recordId = `${period}_${code}_${dateInsc}`;
                        const docRef = doc(db, "enrollments", recordId);

                        const recordData = {
                            Periodo: period,
                            Codigo: code,
                            Nombre: String(row.Nombre || "").trim(),
                            Apellido: String(row.Apellido || "").trim(),
                            FechaNacimiento: String(row.FechaNacimiento || ""),
                            Edad: Number(row.Edad) || 0,
                            Genero: String(row.Genero || ""),
                            DescFacultad: String(row.DescFacultad || ""),
                            Region: String(row.Region || ""),
                            DescCampus: String(row.DescCampus || ""),
                            Descripcion_Carrera: String(row.Descripcion_Carrera || ""),
                            TipoEst_: String(row.TipoEst_ || ""),
                            Fecha_Inscripcion: dateInsc,
                            Fecha_asignacion: String(row.Fecha_asignacion || ""),
                            Cohorte: String(row.Cohorte || ""),
                            CorreoInstitucional: String(row.CorreoInstitucional || ""),
                            CorreoPersonal: String(row.CorreoPersonal || ""),
                            Celular: String(row.Celular || ""),
                            EstatusCursos: String(row.EstatusCursos || ""),
                            Periodicdad: String(row.Periodicdad || "")
                        };

                        batch.set(docRef, recordData, { merge: true });
                        batchCount++;
                        processedCount++;

                        if (batchCount >= batchSize) {
                            await batch.commit();
                            batch = writeBatch(db);
                            batchCount = 0;
                        }
                    }

                    if (batchCount > 0) {
                        await batch.commit();
                    }

                    showToast(`¡Importación exitosa! ${processedCount} registros sincronizados (sin duplicados).`, "success");
                    e.target.value = "";
                    await loadDataAndInitialize();
                } catch (err) {
                    console.error(err);
                    hideLoading();
                    showToast("Error al procesar el archivo: " + err.message, "error");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportToExcel() {
            if (allEnrollmentsCache.length === 0) {
                showToast("No hay datos para exportar.", "error");
                return;
            }
            const exportData = allEnrollmentsCache.map(item => ({
                Periodo: item.Periodo,
                Codigo: item.Codigo,
                Nombre: item.Nombre,
                Apellido: item.Apellido,
                FechaNacimiento: item.FechaNacimiento,
                Edad: item.Edad,
                Genero: item.Genero,
                DescFacultad: item.DescFacultad,
                Region: item.Region,
                DescCampus: item.DescCampus,
                Descripcion_Carrera: item.Descripcion_Carrera,
                TipoEst_: item.TipoEst_,
                Fecha_Inscripcion: item.Fecha_Inscripcion,
                Fecha_asignacion: item.Fecha_asignacion,
                Cohorte: item.Cohorte,
                CorreoInstitucional: item.CorreoInstitucional,
                CorreoPersonal: item.CorreoPersonal,
                Celular: item.Celular,
                EstatusCursos: item.EstatusCursos,
                Periodicdad: item.Periodicdad
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Admisiones");
            XLSX.writeFile(workbook, `Avance_Admisiones_${currentSelectedMonth}.xlsx`);
            showToast("Exportación completada con éxito", "success");
        }

        function showLoading(msg) {
            const overlay = document.getElementById("loading-overlay");
            const text = document.getElementById("loading-text");
            text.textContent = msg;
            overlay.classList.remove("hidden");
        }

        function hideLoading() {
            const overlay = document.getElementById("loading-overlay");
            overlay.classList.add("hidden");
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = `fixed bottom-6 right-6 px-6 py-3 rounded-lg shadow-xl text-white font-medium z-50 transition-all duration-300 ${type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.classList.remove("hidden");
            setTimeout(() => {
                toast.classList.add("hidden");
            }, 4000);
        }
    </script>
</head>
