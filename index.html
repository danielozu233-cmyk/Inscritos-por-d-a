<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153b52"><title>Avance de admisiones</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script type="module" src="app.js"></script>
</head><body><header><div class="brand"><div><h1>Avance de admisiones</h1><p>Resumen diario por facultad</p></div></div><label class="upload">Importar datos<input id="file" type="file" accept=".xlsx,.xls,.csv"></label></header>
<main><div class="session-bar"><span id="signedEmail"></span><button id="logout" class="secondary">Cerrar sesión</button></div><section class="controls"><div class="month-tabs" id="months"></div><div class="date-nav"><button id="prev" aria-label="Día anterior">←</button><input id="date" type="date"><button id="next" aria-label="Día siguiente">→</button><button id="today">Hoy</button></div><select id="facultyFilter"><option value="">Todas las facultades</option></select><button id="export" class="secondary">Descargar reporte</button></section>
<section class="summary"><div><span>Inscritos del mes</span><strong id="dayTotal">0</strong></div><div><span>Facultades</span><strong id="facultyTotal">0</strong></div><div><span>Registros cargados</span><strong id="recordTotal">0</strong></div></section>
<section id="calendar" class="calendar"></section><div class="empty" id="empty">Importa un archivo Excel para comenzar.</div>
<footer>Reporte de admisiones <span>·</span> Resumen por facultad</footer></main>
</body></html>
